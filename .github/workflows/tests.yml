name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: jobqueue
          POSTGRES_PASSWORD: jobqueue
          POSTGRES_DB: jobqueue
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jobqueue"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: pytest -v
